server {
    listen 80;
    server_name localhost;

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }

    # Block direct access to sensitive files
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ /(wp-config\.php|wp-admin/install\.php)$ {
        deny all;
        return 404;
    }

    # Proxy everything to the WordPress/Apache container.
    # X-Forwarded-Port tells WordPress what public port the browser used —
    # without it WordPress compares the stored siteurl (port 8080) against
    # the incoming Host header (port 80) and issues an infinite redirect.
    location / {
        proxy_pass         http://wordpress:80;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;

        proxy_buffers          4 256k;
        proxy_buffer_size      128k;
        proxy_busy_buffers_size 256k;
    }

    # Static assets — still proxied (Apache serves them from the volume),
    # but with long cache headers added by nginx.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        proxy_pass         http://wordpress:80;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        expires            6M;
        access_log         off;
        add_header         Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               font/opentype application/vnd.ms-fontobject image/svg+xml;
}