server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html index.htm;


    # Health check endpoint (useful for Docker healthcheck)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }

    # Deny access to sensitive files/directories
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ /(wp-config\.php|wp-admin/install\.php)$ {
        deny all;
        return 404;
    }

    # Pass all requests to the WordPress Apache container
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer settings for WooCommerce
        proxy_buffers 4 256k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
    }

    # Static file caching (served directly by Nginx for performance)
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        proxy_pass http://wordpress:80;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression for faster transfer
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript font/opentype application/vnd.ms-fontobject image/svg+xml;
}
