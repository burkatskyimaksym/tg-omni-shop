[PHP]
; Increase memory limit for WooCommerce
memory_limit = 256M

; Increase upload limits for product images
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Longer execution time for bulk operations
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000

; Error reporting (adjust for production vs development)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php_errors.log

; Session configuration
session.gc_maxlifetime = 1440
session.cookie_httponly = On

; OPcache settings for better performance
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1